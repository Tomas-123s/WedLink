name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Backend/WedLink.sln
      - run: dotnet build Backend/WedLink.sln --no-restore --configuration Release
      - run: dotnet test Backend/WedLink.sln --no-build --configuration Release --logger "console;verbosity=minimal"

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
