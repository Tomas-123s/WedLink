name: Keep Render API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-connrefused --retry-delay 10 --max-time 240 https://wedlink-api.onrender.com/api/v1/health
