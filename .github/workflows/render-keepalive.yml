name: Keep Render API awake

on:
  push:
    branches: [main]
  schedule:
    # Keep the 10-minute cadence, offset from the start of each hour when
    # GitHub Actions scheduled runs are most likely to be delayed.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-connrefused --retry-delay 10 --max-time 240 https://wedlink-api.onrender.com/api/v1/health
