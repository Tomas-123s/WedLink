name: Keep Render API awake

on:
  push:
    branches: [main]
  schedule:
    # Ping every 5 minutes, offset from the start of the hour to reduce
    # GitHub Actions schedule delays and keep Render below its 15-minute idle window.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-connrefused --retry-delay 10 --max-time 240 https://wedlink-api.onrender.com/api/v1/health
