services:
  - type: web
    name: wedlink-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # Set this in Render's dashboard to MonsterASP's Remote connection string.
      # The API runs on Render, so localhost and MonsterASP's Local string won't work.
      - key: ConnectionStrings__WedLinkDb
        sync: false
      - key: PublicSite__BaseUrl
        value: https://wedlink-frontend-green.vercel.app
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
